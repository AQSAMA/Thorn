name: PR Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  signed-preview-artifact:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          missing=0
          for secret_name in ANDROID_KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD KEYSTORE_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required signing secret: ${secret_name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Signed PR preview artifacts require all Android signing secrets."
            exit 1
          fi

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve preview metadata
        id: preview
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PREVIEW_ID="${{ github.event.pull_request.number }}"
          else
            PREVIEW_ID="${{ github.run_number }}"
          fi

          echo "pr_number=$PREVIEW_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=Thor-preview-${PREVIEW_ID}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Build signed preview APKs
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_FILE_PATH: ${{ github.workspace }}/app/release.jks
        run: |
          ./gradlew \
            copyFossPreviewReleaseApk \
            copyStorePreviewReleaseApk \
            -PprNumber=${{ steps.preview.outputs.pr_number }}

      - name: Upload signed preview APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.preview.outputs.artifact_name }}
          if-no-files-found: error
          path: |
            app/build/distribution/foss/fossPreviewRelease/fossPreviewRelease.apk
            app/build/distribution/store/storePreviewRelease/storePreviewRelease.apk

      - name: Cleanup sensitive files
        if: always()
        run: rm -f app/release.jks
